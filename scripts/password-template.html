<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Acceso · Cuaderno digital</title>
    <style>
      :root { color-scheme: light dark; --fondo: #f3f5f7; --panel: #fff; --texto: #243041; --secundario: #526174; --borde: #d8dee5; --acento: #254c78; --sobre-acento: #fff; --error: #b91c1c; }
      @media (prefers-color-scheme: dark) {
        :root { --fondo: #0f172a; --panel: #1e293b; --texto: #f1f5f9; --secundario: #cbd5e1; --borde: #475569; --acento: #93b4ff; --sobre-acento: #0f172a; --error: #fca5a5; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; padding: 20px; display: grid; place-items: center; background: var(--fondo); color: var(--texto); font: 14px/1.5 system-ui, sans-serif; }
      main { width: 100%; max-width: 400px; padding: 28px; border: 1px solid var(--borde); border-radius: 12px; background: var(--panel); }
      h1 { font-size: 22px; line-height: 1.3; margin: 0 0 8px; }
      p { margin: 0 0 24px; color: var(--secundario); }
      fieldset { padding: 0; margin: 0; border: 0; min-width: 0; }
      label { display: block; margin-bottom: 6px; }
      .clave { display: flex; align-items: center; border: 1px solid var(--borde); border-radius: 6px; overflow: hidden; }
      input[type="password"], input[type="text"] { width: 100%; min-width: 0; border: 0; padding: 10px 12px; font: inherit; font-size: 16px; color: inherit; background: transparent; }
      button { border: 0; border-radius: 6px; cursor: pointer; font: inherit; min-height: 40px; padding: 8px 12px; }
      .mostrar { background: transparent; color: var(--acento); }
      .recordar { display: flex; gap: 8px; align-items: start; margin: 16px 0; color: var(--secundario); }
      .recordar input { margin: 4px 0 0; accent-color: var(--acento); }
      .abrir { width: 100%; background: var(--acento); color: var(--sobre-acento); }
      :focus-visible { outline: 2px solid var(--acento); outline-offset: -2px; }
      button:disabled { cursor: wait; opacity: .6; }
      #error { color: var(--error); margin: 12px 0 0; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main aria-labelledby="titulo-acceso">
      <h1 id="titulo-acceso">Cuaderno digital</h1>
      <p>Introduce la contraseña para abrir el cuaderno.</p>
      <noscript>Necesitas activar JavaScript para abrir esta página cifrada.</noscript>
      <form id="acceso">
        <fieldset id="campos" disabled>
          <label for="clave">Contraseña</label>
          <div class="clave">
            <input id="clave" type="password" name="password" autocomplete="current-password" required aria-describedby="error">
            <button class="mostrar" id="mostrar" type="button" aria-label="Mostrar contraseña" aria-pressed="false">Mostrar</button>
          </div>
          <label class="recordar"><input id="recordar" type="checkbox">Recordar acceso durante un día en este navegador</label>
          <button class="abrir" id="abrir" type="submit">Abrir cuaderno</button>
        </fieldset>
        <p id="error" role="alert" hidden></p>
      </form>
    </main>
    <script>
      // StatiCrypt sustituye estos marcadores durante la compilación; aquí no se guarda la contraseña.
      const iniciarCifrado = /*[|js_staticrypt|]*/0;
      const configuracion = /*[|staticrypt_config|]*/0;
      const ambito = location.pathname.replace(/index\.html$/, '');
      const cifrado = iniciarCifrado.init(configuracion, {
        rememberExpirationKey: `cuaderno-digital.acceso:${ambito}:caducidad`,
        rememberPassphraseKey: `cuaderno-digital.acceso:${ambito}:clave`
      });
      const formulario = document.getElementById('acceso');
      const campos = document.getElementById('campos');
      const clave = document.getElementById('clave');
      const abrir = document.getElementById('abrir');
      const error = document.getElementById('error');

      function mostrarError(texto) {
        error.textContent = texto;
        error.hidden = false;
      }

      window.addEventListener('load', async () => {
        if (!window.crypto?.subtle) {
          mostrarError('Abre esta página mediante HTTPS para poder descifrarla.');
          return;
        }
        try {
          if ((await cifrado.handleDecryptOnLoad()).isSuccessful) return;
        } catch {
          mostrarError('No se pudo recuperar el acceso recordado. Introduce la contraseña.');
        }
        campos.disabled = false;
        clave.focus();
      });

      document.getElementById('mostrar').addEventListener('click', evento => {
        const visible = clave.type === 'password';
        clave.type = visible ? 'text' : 'password';
        evento.currentTarget.textContent = visible ? 'Ocultar' : 'Mostrar';
        evento.currentTarget.setAttribute('aria-label', visible ? 'Ocultar contraseña' : 'Mostrar contraseña');
        evento.currentTarget.setAttribute('aria-pressed', String(visible));
      });

      formulario.addEventListener('submit', async evento => {
        evento.preventDefault();
        campos.disabled = true;
        formulario.setAttribute('aria-busy', 'true');
        abrir.textContent = 'Abriendo…';
        error.hidden = true;
        try {
          const resultado = await cifrado.handleDecryptionOfPage(clave.value, document.getElementById('recordar').checked);
          if (resultado.isSuccessful) return;
          mostrarError('Contraseña incorrecta. Vuelve a intentarlo.');
          clave.setAttribute('aria-invalid', 'true');
        } catch {
          mostrarError('No se pudo abrir el cuaderno. Recarga la página e inténtalo de nuevo.');
        }
        campos.disabled = false;
        formulario.setAttribute('aria-busy', 'false');
        abrir.textContent = 'Abrir cuaderno';
        clave.focus();
        clave.select();
      });
    </script>
  </body>
</html>
